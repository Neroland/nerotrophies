modLoader = "javafml"
loaderVersion = "${forge_loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
logoFile = "nerotrophies_logo.png"
description = '''
Trophies for the Neroland mod family: a cross-mod record of what you have done, shown off as trophies, pedestals and cabinets in your base.
'''

[[mixins]]
config = "nerotrophies-common.mixins.json"

[[dependencies.${mod_id}]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

# Neroland Core — required shared foundation; must load BEFORE NeroTrophies (ordering = AFTER).
# Core is the ONLY dependency.
[[dependencies.${mod_id}]]
modId = "nerolandcore"
mandatory = true
versionRange = "${nerolandcore_version_range}"
ordering = "AFTER"
side = "BOTH"
