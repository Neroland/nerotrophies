// fabric: Fabric Loom. De-obfuscated 26.x: NO `mappings` line. Shares the common
// module's source directly (single copy -> no drift).

plugins {
    // Two Loom flavours from the same plugin jar: `fabric-loom` for de-obfuscated 26.x (no mappings, no
    // remap) and `fabric-loom-remap` for obfuscated 1.21.x (Mojang mappings + remapJar to intermediary).
    // Neither is applied here; the node picks one below from its Minecraft version.
    id 'net.fabricmc.fabric-loom' apply false
    id 'net.fabricmc.fabric-loom-remap' apply false
    id 'eclipse'   // for eclipse.synchronizationTasks (VS Code / Buildship import hook)
    id 'maven-publish'
}

// MC version comes from the Stonecutter node (e.g. :fabric:26.1.2), not a global property.
def mc = stonecutter.current.version
// Minecraft before 26.1 ships obfuscated, so those cells need mappings and a remapped jar.
def obfuscated = mc.startsWith('1.')
apply plugin: obfuscated ? 'net.fabricmc.fabric-loom-remap' : 'net.fabricmc.fabric-loom'
// Upper bound of this cell's Minecraft range: the next minor line (26.1.2 -> 26.2, 26.2 -> 26.3), same
// expression as Neroland Core, so each cell's jar declares only its own MC line.
def mcCeiling = project.findProperty("mc_ceiling_${mc}") ?: mc.tokenize('.').with { "${it[0]}.${it[1].toInteger() + 1}" }
// Lowest Minecraft this jar accepts: the compiled version, or an older hotfix sibling (gradle.properties).
// 1.21.x cells spell out their [floor, ceiling) range there (mc_floor_<v> / mc_ceiling_<v>).
def mcFloor = project.findProperty("mc_floor_${mc}") ?: mc
def fabricApi = project.findProperty("fabric_api_version_${mc}")
def nerolandcoreVersion = project.findProperty('nerolandcore_version')

// This node's projectDir is <loader>/versions/<v>; the authoritative loader source +
// resources live in the BRANCH root (fabric/). Resolve branch-root paths via the parent.
def branchDir = project.parent.projectDir

// Distinct, descriptive jar name per cell (the node project is named after the MC version, so the
// default jar would be "<mc>-<version>.jar" and COLLIDE with the neoforge cell of the same version).
base { archivesName = "nerotrophies-fabric-${mc}" }

// Publish this cell's jar as a Maven artifact so other Nero mods can declare NeroTrophies a dependency:
// `za.co.neroland.nerotrophies:nerotrophies-fabric-<mc>:<version>`. Mirrors Neroland Core's publishing setup.
// `./gradlew publishToMavenLocal` installs all nine cells locally for dev. Dependency-free POM on purpose.
publishing {
    publications {
        register('mod', MavenPublication) {
            groupId = rootProject.mod_group_id
            artifactId = "nerotrophies-fabric-${mc}"
            version = rootProject.mod_version
            // 1.21.x consumers remap NeroTrophies with modImplementation, so they need the intermediary jar.
            artifact tasks.named(obfuscated ? 'remapJar' : 'jar')
        }
    }
    // Remote target so a fresh CI runner / clone (empty ~/.m2) can resolve NeroTrophies — GitHub Packages
    // Maven for the NeroTrophies repo. `publishToMavenLocal` still works for local dev; `publish` (or
    // publishModPublicationToGitHubPackagesRepository) pushes here. Auth: gradle props gpr.user/gpr.key,
    // else env GITHUB_ACTOR/GITHUB_TOKEN (both present in GitHub Actions). Lazy getOrNull() means a
    // build that doesn't touch this repo (e.g. a contributor with no token) won't fail at configuration.
    // Privacy (POPIA/GDPR): publishes only build artifacts + version strings, no personal data.
    repositories {
        maven {
            name = 'GitHubPackages'
            url = 'https://maven.pkg.github.com/Neroland/nerotrophies'
            credentials {
                username = providers.gradleProperty('gpr.user').orElse(providers.environmentVariable('GITHUB_ACTOR')).getOrNull()
                password = providers.gradleProperty('gpr.key').orElse(providers.environmentVariable('GITHUB_TOKEN')).getOrNull()
            }
        }
    }
}

// Pull in the shared common source + resources.
sourceSets.main.java.srcDir rootProject.ext.commonJava
sourceSets.main.resources.srcDir rootProject.ext.commonResources

dependencies {
    minecraft "com.mojang:minecraft:${mc}"
    if (obfuscated) {
        // Obfuscated 1.21.x: Mojang's official names, remapped to intermediary on jar. Mod dependencies
        // (loader, Fabric API, Core) go through modImplementation so Loom remaps them.
        mappings loom.officialMojangMappings()
        modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
        if (fabricApi != null) {
            modImplementation "net.fabricmc.fabric-api:fabric-api:${fabricApi}"
        }
        modImplementation "za.co.neroland.nerolandcore:nerolandcore-fabric-${mc}:${nerolandcoreVersion}"
    } else {
    // NOTE: no `mappings` — de-obfuscated 26.x needs none (Fabric Loom 1.17+).
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    if (fabricApi != null) {
        implementation "net.fabricmc.fabric-api:fabric-api:${fabricApi}"
    }

    // Neroland Core — REQUIRED shared foundation (config schema). Plain `implementation` (NOT
    // `include`) — this de-obf 26.x Loom setup omits `mappings`, so there is no intermediary→named
    // remap and `modImplementation` isn't available. Core ships as its own mod and loads BEFORE
    // NeroTrophies (see fabric.mod.json depends).
    implementation "za.co.neroland.nerolandcore:nerolandcore-fabric-${mc}:${nerolandcoreVersion}"
    }

    // Sentry SDK (telemetry/NeroTrophiesTelemetry): compile against it + embed it as a jar-in-jar so the
    // shipped Fabric jar carries it. Counterpart to the NeoForge JarJar bundling.
    implementation 'io.sentry:sentry:8.64.0'
    include 'io.sentry:sentry:8.64.0'
}

// Expand fabric.mod.json from src/main/templates into a generated resources dir.
// The template is NOT under src/main/resources, so the IDE never copies a RAW
// (token-laden) fabric.mod.json into bin/main. eclipse.synchronizationTasks runs
// this on VS Code/Buildship import, so bin/main gets the EXPANDED manifest and
// Run & Debug works — while values stay dynamic (sourced from gradle.properties).
def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def props = [
        mod_id               : rootProject.mod_id,
        mod_version          : rootProject.mod_version,
        mod_name             : rootProject.mod_name,
        mod_authors          : rootProject.mod_authors,
        mod_license          : rootProject.mod_license,
        fabric_loader_version: rootProject.fabric_loader_version,
        minecraft_version    : mcFloor,
        minecraft_version_ceiling: mcCeiling,
        nerolandcore_version : nerolandcoreVersion,
    ]
    inputs.properties(props)
    expand(props)
    from "${branchDir}/src/main/templates"
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}
sourceSets.main.resources.srcDir generateModMetadata

// Bundle the public wiki/*.md pages (plus a generated index.json) under assets/nerotrophies/wiki so the
// NeroLink module's wiki section can serve them (WIKI CONTRACT v1).
def generateWikiResources = tasks.register('generateWikiResources', Copy) {
    def wikiSrcDir = file("${rootProject.projectDir}/wiki")
    from(wikiSrcDir) {
        include '*.md'
        into 'assets/nerotrophies/wiki'
    }
    into layout.buildDirectory.dir('generated/sources/wiki')
    doLast {
        def outDir = layout.buildDirectory.dir('generated/sources/wiki/assets/nerotrophies/wiki').get().asFile
        outDir.mkdirs()
        def entries = []
        wikiSrcDir.listFiles()?.findAll { it.isFile() && it.name.endsWith('.md') }?.sort { it.name }?.each { f ->
            def slug = f.name.substring(0, f.name.length() - 3)
            def title = slug.replace('-', ' ')
            for (String line : f.readLines('UTF-8')) {
                def t = line.trim()
                if (t.startsWith('# ')) { title = t.substring(2).trim(); break }
                if (!t.isEmpty()) break
            }
            entries << [slug: slug, title: title]
        }
        def sb = new StringBuilder('{\n  "pages": [\n')
        entries.eachWithIndex { e, i ->
            sb.append('    {"slug": ').append(groovy.json.JsonOutput.toJson(e.slug))
              .append(', "title": ').append(groovy.json.JsonOutput.toJson(e.title)).append('}')
              .append(i < entries.size() - 1 ? ',' : '').append('\n')
        }
        sb.append('  ]\n}\n')
        new File(outDir, 'index.json').write(sb.toString(), 'UTF-8')
    }
}
sourceSets.main.resources.srcDir generateWikiResources
eclipse.synchronizationTasks generateWikiResources
eclipse.synchronizationTasks generateModMetadata

// The access widener's namespace differs by era: 26.x is `official` (de-obfuscated), 1.21.x is `named`
// (Mojang mappings, remapped to intermediary in remapJar). Each 1.21.x line has its own file under
// src/main/accesswidener/, swapped into the jar under the name fabric.mod.json declares.
def awFile = obfuscated ? file("${branchDir}/src/main/accesswidener/${mc}.accesswidener")
        : file("${branchDir}/src/main/resources/nerotrophies.accesswidener")
if (obfuscated) {
    tasks.named('processResources', ProcessResources) {
        exclude 'nerotrophies.accesswidener'
        from(awFile) { rename { 'nerotrophies.accesswidener' } }
    }
}

loom {
    accessWidenerPath = awFile

    runs {
        client {
            client()
            // Do NOT let Loom write Eclipse *.launch files — they embed absolute machine
            // paths. The committed .vscode/launch.json (relative ${workspaceFolder}) is the
            // single source of truth for run/debug.
            ideConfigGenerated false
            runDir 'runs/client'
        }
        server {
            server()
            ideConfigGenerated false
            runDir 'runs/server'
        }
    }
}

// Loom creates each run's `runDir` lazily on first launch, but VS Code opens the
// debug terminal in that cwd BEFORE the program starts — so a never-yet-run config
// fails with "Starting directory (cwd) ... does not exist". Pre-create the dirs so
// the cwd always exists. Wired into (a) the Fabric preLaunchTask `configureLaunch`
// (runs before each launch) and (b) eclipse.synchronizationTasks (fresh IDE import).
def createFabricRunDirs = tasks.register('createFabricRunDirs') {
    description = 'Pre-create Loom run directories so the IDE debug-terminal cwd exists before first launch.'
    doLast {
        file('runs/client').mkdirs()
        file('runs/server').mkdirs()
    }
}
eclipse.synchronizationTasks createFabricRunDirs
tasks.matching { it.name == 'configureLaunch' }.configureEach { dependsOn createFabricRunDirs }

// ecjCheck: run the Eclipse compiler over common + fabric main sources, with the same prefs as VS Code.
configurations {
    ecj
}
dependencies {
    ecj 'org.eclipse.jdt:ecj:+'
}
tasks.register('ecjCheck', JavaExec) {
    group = 'verification'
    description = 'Run the Eclipse (IDE) analyzer over common + fabric main sources and report its diagnostics.'
    notCompatibleWithConfigurationCache('assembles the analysis classpath at execution time')
    dependsOn tasks.named('compileJava')
    classpath = configurations.ecj
    mainClass = 'org.eclipse.jdt.internal.compiler.batch.Main'
    doFirst {
        def analysisCp = (sourceSets.main.compileClasspath.files + sourceSets.main.output.files)
                .findAll { it.exists() }
                .join(File.pathSeparator)
        // The source FILES, not the source dirs, so any source excludes apply here exactly as in
        // compileJava. Passed through an @argfile (forward slashes) to keep the Windows command line short.
        def ecjSources = project.layout.buildDirectory.file('tmp/ecjCheck/sources.txt').get().asFile
        ecjSources.parentFile.mkdirs()
        ecjSources.text = sourceSets.main.java.files.collect { it.absolutePath.replace('\\', '/') }.join('\n') + '\n'
        def srcDirs = ['@' + ecjSources.absolutePath.replace('\\', '/')]
        args = [
                '--release', "${project.javaRelease}",
                '-proc:none',
                '-d', 'none',
                '-properties', rootProject.file('tools/ecj.prefs').absolutePath,
                // No '-warn:' override — tools/ecj.prefs is the single source of truth for severities.
                // A CLI -warn:+token forces a category ON regardless of the prefs `ignore`, so the
                // framework-interop nullness categories would re-appear. nullanalysis=enabled in the
                // prefs already turns annotation-based analysis on for the genuine categories.
                '-annotationpath', 'CLASSPATH',
                '-classpath', analysisCp,
        ] + srcDirs
    }
}

// Server game test harness (Fabric API fabric-gametest-api-v1) - the 26.3 Fabric cell only (privacy compliance).
// A separate `gametest` source set (fabric/src/gametest, its own fabric.mod.json) that Loom runs as a second mod in
// a real dedicated game-test server: real block-entity, item, player and chunk NBT, Core's erasure hook and the
// SavedDataRecovery backup files on disk. It is never part of sourceSets.main, so nothing here reaches the shipped
// jar. Run: gradlew :fabric:26.3:runGameTest (same pattern as the sibling client game test harnesses).
if (mc == '26.3') {
    // `fabricApi` alone would resolve to the Fabric API version string defined at the top of this script.
    project.extensions.getByName('fabricApi').with {
        configureTests {
            createSourceSet = true
            modId = 'nerotrophies_compliancetest'
            enableGameTests = true
            enableClientGameTests = false
        }
    }
}
